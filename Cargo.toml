[workspace]
resolver = "3"
members = [
    "crates/directory",
    "crates/model",
    "crates/host",
]

[workspace.package]
license = "Apache-2.0"
repository = "https://github.com/Thooer/croon-app"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
croon-eval = { path = "../croon/crates/eval" }
croon-port = { path = "../croon/crates/port" }
croon-tree = { path = "../croon/crates/tree" }
lang0 = { path = "../croon-lang0/crates/lang0" }
scenarios = { path = "../croon/crates/scenarios" }
kernel = { path = "../croon/crates/kernel" }
directory = { path = "crates/directory" }
model = { path = "crates/model" }
serde_json = { version = "1", default-features = false, features = ["std", "float_roundtrip"] }
libc = { version = "=0.2.191", default-features = false }

[profile.release]
overflow-checks = true
